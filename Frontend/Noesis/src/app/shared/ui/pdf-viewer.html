<div class="bar" role="toolbar" aria-label="PDF controls">
  <button class="btn btn--quiet btn--icon btn--sm" type="button" (click)="step(-1)" [disabled]="current() <= 1 || !total()" aria-label="Previous page">
    <app-icon name="left" [size]="16" />
  </button>
  <label class="pageno">
    <span class="sr-only">Page</span>
    <input class="mono" type="text" inputmode="numeric" [value]="current()" (change)="jump($event)"
           (keydown.enter)="jump($event)" [disabled]="!total()" />
    <span class="mono muted">/ {{ total() || '–' }}</span>
  </label>
  <button class="btn btn--quiet btn--icon btn--sm" type="button" (click)="step(1)" [disabled]="current() >= total()" aria-label="Next page">
    <app-icon name="right" [size]="16" />
  </button>
  <span class="spacer"></span>
  <button class="btn btn--quiet btn--icon btn--sm" type="button" (click)="zoom(1 / 1.15)" [disabled]="!total()" aria-label="Zoom out">
    <app-icon name="zoom-out" [size]="16" />
  </button>
  <button class="btn btn--quiet btn--sm mono" type="button" (click)="zoom('fit')" [disabled]="!total()" title="Fit width">
    {{ zoomLabel() }}
  </button>
  <button class="btn btn--quiet btn--icon btn--sm" type="button" (click)="zoom(1.15)" [disabled]="!total()" aria-label="Zoom in">
    <app-icon name="zoom-in" [size]="16" />
  </button>
</div>

<div class="scroller" #scroller (scroll)="onScroll()" tabindex="0" aria-label="PDF pages">
  @if (loading()) {
    <div class="state">
      <div class="skeleton sheet"></div>
      <p class="muted"><span class="spinner"></span> Opening PDF…</p>
    </div>
  } @else if (error()) {
    <div class="state">
      <div class="alert" role="alert">
        <div>{{ error() }}</div>
        <button class="btn btn--sm" type="button" (click)="retry()">Retry</button>
      </div>
    </div>
  }
  @for (s of shells(); track s.n) {
    <div class="pg" [attr.data-page]="s.n" [style.width.px]="s.w" [style.height.px]="s.h"
         [attr.aria-label]="'Page ' + s.n"></div>
  }
</div>
